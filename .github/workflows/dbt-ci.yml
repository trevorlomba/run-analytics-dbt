name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate synthetic sample data
        run: |
          python scripts/make_sample_data.py
          git diff --exit-code data/sample  # generator is seeded; output must match what's committed

      - name: dbt build (models + tests) on sample data
        run: |
          dbt build --vars '{raw_data_dir: data/sample}'

      - name: dbt docs generate
        run: |
          dbt docs generate --vars '{raw_data_dir: data/sample}'

      - name: Build the dashboard from the sample marts
        run: |
          python scripts/build_dashboard.py --sample --standalone --out dist/index.html
